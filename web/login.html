<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login — AI Digital Feedback System">
    <title>Admin Login — AI Feedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- LOGIN PAGE -->
    <section class="login-page">
        <!-- Animated orb -->
        <div class="login-orb"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🔒</div>
                <h2>Admin Login</h2>
                <p>Sign in to access the dashboard</p>
            </div>

            <div class="login-error" id="loginError">
                Invalid username or password. Please try again.
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width: 100%;">
                    Sign In
                </button>
            </form>

            <p style="text-align: center; margin-top: 24px; font-size: 0.82rem; color: var(--text-secondary);">
                <a href="index.html" style="color: var(--primary); font-weight: 500;">← Back to Home</a>
            </p>
        </div>
    </section>

    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.textContent = isPassword ? '🙈' : '👁';
        });

        // Login form submission
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.remove('show');

            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Please enter both username and password.';
                loginError.classList.add('show');
                return;
            }

            // Show loading state
            loginBtn.classList.add('btn-loading');
            loginBtn.textContent = 'Signing in...';

            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = 'admin.jsp';
                } else {
                    loginError.textContent = data.message || 'Invalid credentials.';
                    loginError.classList.add('show');
                    loginBtn.classList.remove('btn-loading');
                    loginBtn.textContent = 'Sign In';
                }
            } catch (error) {
                loginError.textContent = 'Connection error. Please try again.';
                loginError.classList.add('show');
                loginBtn.classList.remove('btn-loading');
                loginBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
